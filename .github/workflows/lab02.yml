name: Lab 02 - Workflow Triggers


on: 
  push: 
    branches: [prod]
    paths: 
      - ".github/workflows/lab02.yaml

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: Select Environment
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
  jobs:
    trigger-demo:
      runs-on: ubuntu-latest
      steps:
        - name: Show Event
          env:
            EVENT_NAME: ${{ github.event }}
            TARGET: ${{ inputs.environment }}

          run: |
            echo "Event: $EVENT_NAME
            echo "Environment: $TARGET
